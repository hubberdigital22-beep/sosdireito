<script>
/* Roda de forma síncrona, antes de qualquer pintura:
   .js         → o CSS pode esconder o que vai ser animado
   .js-sem-motion → o conteúdo entra pronto, sem animação
   Sem JavaScript, nenhuma das duas classes existe e nada é escondido. */
(function () {
  var e = document.documentElement;
  e.classList.add('js');
  try {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      e.classList.add('js-sem-motion');
    }
  } catch (err) {}
})();
</script>
